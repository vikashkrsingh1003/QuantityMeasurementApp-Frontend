<div class="auth-bg">
  <div class="auth-card">

    <!-- LEFT PANEL -->
    <div class="auth-left">
      <div class="illustration">
        <svg viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg" class="lab-svg">
          <rect x="18" y="148" width="44" height="12" rx="3" fill="#8B6343"/>
          <rect x="20" y="148" width="40" height="4" rx="2" fill="#a07850"/>
          <rect x="30" y="138" width="20" height="12" rx="2" fill="#b8860b"/>
          <rect x="32" y="136" width="16" height="4" rx="2" fill="#c8982b"/>
          <ellipse cx="40" cy="118" rx="24" ry="22" fill="#a8c8e8" opacity="0.85"/>
          <ellipse cx="40" cy="118" rx="24" ry="22" fill="none" stroke="#7aaac8" stroke-width="1.5"/>
          <rect x="16" y="116" width="48" height="10" fill="#8ab8d8" opacity="0.4"/>
          <line x1="52" y1="108" x2="58" y2="108" stroke="#7aaac8" stroke-width="1"/>
          <line x1="52" y1="115" x2="56" y2="115" stroke="#7aaac8" stroke-width="1"/>
          <line x1="52" y1="122" x2="58" y2="122" stroke="#7aaac8" stroke-width="1"/>
          <rect x="73" y="148" width="44" height="12" rx="3" fill="#8B6343"/>
          <rect x="84" y="60" width="22" height="90" rx="8" fill="#a8c8e8" opacity="0.85"/>
          <rect x="84" y="60" width="22" height="90" rx="8" fill="none" stroke="#7aaac8" stroke-width="1.5"/>
          <rect x="88" y="52" width="14" height="10" rx="3" fill="#b8d8e8"/>
          <rect x="90" y="44" width="10" height="10" rx="2" fill="#c8e0f0"/>
          <rect x="84" y="120" width="22" height="30" fill="#7ab0d0" opacity="0.35"/>
          <rect x="87" y="88" width="16" height="22" rx="2" fill="#f5e6c8" opacity="0.9"/>
          <rect x="128" y="148" width="44" height="12" rx="3" fill="#8B6343"/>
          <rect x="140" y="138" width="20" height="12" rx="2" fill="#b8860b"/>
          <rect x="126" y="100" width="48" height="50" rx="10" fill="#a8c8e8" opacity="0.85"/>
          <rect x="126" y="100" width="48" height="50" rx="10" fill="none" stroke="#7aaac8" stroke-width="1.5"/>
          <rect x="133" y="110" width="20" height="26" rx="2" fill="#f5e6c8" opacity="0.9"/>
          <rect x="188" y="148" width="44" height="12" rx="3" fill="#8B6343"/>
          <polygon points="210,60 198,148 222,148" fill="#a8c8e8" opacity="0.85"/>
          <polygon points="210,60 198,148 222,148" fill="none" stroke="#7aaac8" stroke-width="1.5"/>
          <rect x="204" y="52" width="12" height="10" rx="2" fill="#b8d8e8"/>
          <polygon points="210,118 200,148 220,148" fill="#7ab0d0" opacity="0.45"/>
        </svg>
      </div>
      <h2 class="brand-title">QUANTITY MEASUREMENT</h2>
      <button class="back-btn" (click)="goToDashboard()">&#8592; Back to App</button>
    </div>

    <div class="auth-divider"></div>

    <!-- RIGHT PANEL -->
    <div class="auth-right">

      <div class="toast toast-success" *ngIf="successMsg">&#10003; {{ successMsg }}</div>
      <div class="toast toast-error"   *ngIf="errorMsg">&#10007; {{ errorMsg }}</div>

      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn" [class.active]="isLoginTab"  (click)="switchTab('login')">LOGIN</button>
        <button class="tab-btn" [class.active]="isSignupTab" (click)="switchTab('signup')">SIGNUP</button>
      </div>
      <div class="tab-underline-track">
        <div class="tab-underline" [class.right]="isTabRight"></div>
      </div>

      <!-- ══════════════ LOGIN FORM ══════════════ -->
      <form *ngIf="isLoginTab" [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form" novalidate>

        <div class="field-group">
          <label class="field-label">Email Id</label>
          <input type="email" class="field-input"
                 [class.invalid]="lfEmail.invalid && lfEmail.touched"
                 formControlName="email" placeholder="Enter your email" autocomplete="email"/>
          <span class="field-error" *ngIf="lfEmail.invalid && lfEmail.touched">{{ lfEmailError }}</span>
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="password-wrap">
            <input [type]="loginPassVisible ? 'text' : 'password'" class="field-input"
                   [class.invalid]="lfPassword.invalid && lfPassword.touched"
                   formControlName="password" placeholder="Enter your password" autocomplete="current-password"/>
            <button type="button" class="eye-btn" (click)="toggleLoginPassword()">
              <svg *ngIf="!loginPassVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <svg *ngIf="loginPassVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="lfPassword.invalid && lfPassword.touched">{{ lfPasswordError }}</span>
        </div>

        <!-- <div class="forgot-row">
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div> -->

        <!-- Email/Password login button -->
        <button type="submit" class="submit-btn" [disabled]="loading">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading" class="btn-spinner"></span>
        </button>

        <!-- Divider -->
        <div class="or-divider">
          <span class="or-line"></span>
          <span class="or-text">or</span>
          <span class="or-line"></span>
        </div>

        <!-- Google Sign-In button — redirects to Spring Security OAuth2 endpoint -->
        <button type="button" class="google-btn" (click)="onGoogleLogin()">
          <!-- Google "G" logo SVG -->
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span>Sign in with Google</span>
        </button>

        <p class="switch-text">
          Don't have an account?
          <a class="switch-link" (click)="switchTab('signup')">Signup</a>
        </p>
      </form>

      <!-- ══════════════ SIGNUP FORM ══════════════ -->
      <form *ngIf="isSignupTab" [formGroup]="signupForm" (ngSubmit)="onSignup()" class="auth-form" novalidate>

        <div class="field-group">
          <label class="field-label">Full Name</label>
          <input type="text" class="field-input"
                 [class.invalid]="sfName.invalid && sfName.touched"
                 formControlName="name" placeholder="Enter your full name" autocomplete="name"/>
          <span class="field-error" *ngIf="sfName.invalid && sfName.touched">Full name is required</span>
        </div>

        <div class="field-group">
          <label class="field-label">Email Id</label>
          <input type="email" class="field-input"
                 [class.invalid]="sfEmail.invalid && sfEmail.touched"
                 formControlName="email" placeholder="Enter your email" autocomplete="email"/>
          <span class="field-error" *ngIf="sfEmail.invalid && sfEmail.touched">{{ sfEmailError }}</span>
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="password-wrap">
            <input [type]="signupPassVisible ? 'text' : 'password'" class="field-input"
                   [class.invalid]="sfPassword.invalid && sfPassword.touched"
                   formControlName="password" placeholder="Create a password" autocomplete="new-password"/>
            <button type="button" class="eye-btn" (click)="toggleSignupPassword()">
              <svg *ngIf="!signupPassVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <svg *ngIf="signupPassVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="sfPassword.invalid && sfPassword.touched">{{ sfPasswordError }}</span>
        </div>

        <div class="field-group">
          <label class="field-label">Confirm Password</label>
          <div class="password-wrap">
            <input [type]="confirmPassVisible ? 'text' : 'password'" class="field-input"
                   [class.invalid]="sfConfirmPassword.invalid && sfConfirmPassword.touched"
                   formControlName="confirmPassword" placeholder="Confirm your password" autocomplete="new-password"/>
            <button type="button" class="eye-btn" (click)="toggleSignupConfirmPassword()">
              <svg *ngIf="!confirmPassVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <svg *ngIf="confirmPassVisible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="sfConfirmPassword.invalid && sfConfirmPassword.touched">{{ sfConfirmPasswordError }}</span>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading">
          <span *ngIf="!loading">Signup</span>
          <span *ngIf="loading" class="btn-spinner"></span>
        </button>

        <p class="switch-text">
          Already have an account?
          <a class="switch-link" (click)="switchTab('login')">Login</a>
        </p>
      </form>

    </div>
  </div>
</div>
